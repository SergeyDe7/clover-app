# Перенаправление HTTP → HTTPS (ACME challenge для SSL)
server {
    listen 80;
    server_name clover-spb.ru www.clover-spb.ru;

    location /.well-known/acme-challenge {
        alias /var/www/dehydrated/.well-known/acme-challenge;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Витрина Clover (тот же UI/API, Host: clover-spb.ru → StorefrontApp)
server {
    listen 443 ssl;
    server_name clover-spb.ru www.clover-spb.ru;

    # После выпуска сертификата dehydrated:
    ssl_certificate /dehydrated/certs/clover-spb.ru/fullchain.pem;
    ssl_certificate_key /dehydrated/certs/clover-spb.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/clover-spb.access.log;
    error_log /var/log/nginx/clover-spb.error.log;

    location / {
        proxy_pass http://192.168.155.15:5273;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://192.168.155.15:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://192.168.155.15:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
