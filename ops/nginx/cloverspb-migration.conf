# Перенос cloverspb.ru → clover-spb.ru (магазин /magazin/… + статика).
# Активировать ТОЛЬКО после DNS A-записей cloverspb.ru + www → IP DC.
#
# 1) В /etc/nginx/nginx.conf внутри http { }:
#    include /opt/clover/clover-app/ops/seo/magazin-301-classified.map.conf;
#    (сгенерировать: node ops/seo/build-classified-magazin-map.mjs)
#
# 2) Подключить этот файл вместо cloverspb-redirect.conf (глупый $request_uri).

# --- HTTP: единый hop на https://clover-spb.ru/... ---
server {
    listen 80;
    listen [::]:80;
    server_name cloverspb.ru www.cloverspb.ru;

    location ^~ /magazin/ {
        if ($clover_magazin_redirect = "") {
            return 301 https://clover-spb.ru/catalog;
        }
        return 301 $clover_magazin_redirect;
    }

    location = /kontakty { return 301 https://clover-spb.ru/contacts; }
    location = /dostavka { return 301 https://clover-spb.ru/contacts; }
    location = /o-kompanii { return 301 https://clover-spb.ru/contacts; }

    location / {
        return 301 https://clover-spb.ru/catalog;
    }
}

# --- HTTPS: после dehydrated (см. порядок переноса) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cloverspb.ru www.cloverspb.ru;

    ssl_certificate     /dehydrated/certs/cloverspb.ru/fullchain.pem;
    ssl_certificate_key /dehydrated/certs/cloverspb.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /magazin/ {
        if ($clover_magazin_redirect = "") {
            return 301 https://clover-spb.ru/catalog;
        }
        return 301 $clover_magazin_redirect;
    }

    location = /kontakty { return 301 https://clover-spb.ru/contacts; }
    location = /dostavka { return 301 https://clover-spb.ru/contacts; }
    location = /o-kompanii { return 301 https://clover-spb.ru/contacts; }

    location / {
        return 301 https://clover-spb.ru/catalog;
    }
}
