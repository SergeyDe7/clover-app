# Redirect legacy cloverspb.ru → canonical clover-spb.ru
# HTTPS-блок включать только после: sudo dehydrated -c -d cloverspb.ru

server {
    listen 80;
    server_name cloverspb.ru www.cloverspb.ru;
    return 301 https://clover-spb.ru$request_uri;
}

