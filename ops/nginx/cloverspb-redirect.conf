# Redirect legacy cloverspb.ru (старый сайт Мегагрупп) → canonical clover-spb.ru
# Install:
#   1) DNS: A-записи cloverspb.ru и www.cloverspb.ru → IP сервера clover-spb.ru
#   2) sudo cp /opt/clover/clover-app/ops/nginx/cloverspb-redirect.conf /etc/nginx/sites-available/cloverspb.ru
#   3) sudo ln -sfn /etc/nginx/sites-available/cloverspb.ru /etc/nginx/sites-enabled/cloverspb.ru
#   4) Добавить в /dehydrated/domains.txt:
#        cloverspb.ru www.cloverspb.ru
#   5) sudo dehydrated -c -d cloverspb.ru
#   6) sudo nginx -t && sudo systemctl reload nginx
#
# Без пункта 1 сертификат Let's Encrypt не выдастся (ACME проверяет DNS).

server {
    listen 443 ssl;
    server_name cloverspb.ru www.cloverspb.ru;

    ssl_certificate /dehydrated/certs/cloverspb.ru/fullchain.pem;
    ssl_certificate_key /dehydrated/certs/cloverspb.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ACME на :80 уже обслуживает dehydrated catch-all
    return 301 https://clover-spb.ru$request_uri;
}
