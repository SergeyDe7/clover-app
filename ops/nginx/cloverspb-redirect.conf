# Redirect legacy cloverspb.ru → clover-spb.ru
# ВАЖНО: не включать, пока DNS cloverspb.ru на Megagroup (иначе перехватите чужой трафик).
# Предпочтительная карта /magazin/... → категории/товары:
#   ops/nginx/cloverspb-magazin-301.conf + ops/seo/magazin-301.map.conf
#   (сборка: node ops/seo/build-magazin-product-map.mjs)
#
# Ниже — устаревший вариант «весь URI как есть» (ломает /magazin/product/... на 404 новой витрины).
# HTTPS-блок включать только после: sudo dehydrated -c -d cloverspb.ru

server {
    listen 80;
    server_name cloverspb.ru www.cloverspb.ru;
    # Временно: лучше использовать cloverspb-magazin-301.conf
    return 301 https://clover-spb.ru/catalog;
}
