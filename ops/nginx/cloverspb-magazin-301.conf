# cloverspb.ru → clover-spb.ru с картой /magazin/... (не всё на главную).
# Подключать ТОЛЬКО когда DNS cloverspb.ru указывает на этот сервер.
# Пока домен на Megagroup — этот файл не активировать для публичного трафика.
#
# Требует: include ops/seo/magazin-301.map.conf (сгенерировать:
#   node ops/seo/build-magazin-product-map.mjs)

# map $uri $clover_magazin_redirect — в http {} через include magazin-301.map.conf

server {
    listen 80;
    server_name cloverspb.ru www.cloverspb.ru;

    # Каталог/товары старого магазина → соответствующие URL новой витрины
    location ^~ /magazin/ {
        if ($clover_magazin_redirect = "") {
            return 301 https://clover-spb.ru/catalog;
        }
        return 301 $clover_magazin_redirect;
    }

    location = /kontakty {
        return 301 https://clover-spb.ru/contacts;
    }
    location = /dostavka {
        return 301 https://clover-spb.ru/contacts;
    }
    location = /o-kompanii {
        return 301 https://clover-spb.ru/contacts;
    }

    # Остальные пути старого сайта — на каталог (не на голую главную)
    location / {
        return 301 https://clover-spb.ru/catalog;
    }
}

