# Redirect-only vhost старого домена cloverspb.ru → clover-spb.ru.
#
# Заменяет текущий /etc/nginx/sites-available/cloverspb.ru, где стоит blanket
# `return 301 https://clover-spb.ru$request_uri` — он переносил бы 910 legacy-путей
# на несуществующие адреса нового сайта.
#
# Устанавливать только на этапе cutover:
#   /etc/nginx/legacy-domain/cloverspb-path-redirects.map
#   /etc/nginx/legacy-domain/cloverspb-path-gone.map
#   /etc/nginx/sites-available/cloverspb.ru
#
# Здесь нет proxy_pass: старый домен никогда не попадает в Clover UI (:5273) или API (:4100).

# Самый длинный legacy-путь — 114 символов, в дефолтные 64 байта бакета он не влезает.
# Директивы глобальные для http-контекста; в базовом nginx.conf они не заданы.
map_hash_max_size 4096;
map_hash_bucket_size 256;

map $uri $cloverspb_redirect {
    default "";
    include /etc/nginx/legacy-domain/cloverspb-path-redirects.map;
}

map $uri $cloverspb_gone {
    default 0;
    include /etc/nginx/legacy-domain/cloverspb-path-gone.map;
}

server {
    listen 80;
    server_name cloverspb.ru www.cloverspb.ru;

    access_log /var/log/nginx/cloverspb-redirect.access.log;
    error_log /var/log/nginx/cloverspb-redirect.error.log warn;

    # Выпуск и продление сертификата старого домена не должны попадать в редиректы.
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/dehydrated/.well-known/acme-challenge/;
        default_type "text/plain";
    }

    location / {
        if ($cloverspb_gone) {
            return 410;
        }
        if ($cloverspb_redirect) {
            return 301 $cloverspb_redirect$is_args$args;
        }
        return 404;
    }
}

# HTTPS-блок включается только после выпуска сертификата старого домена:
#   sudo dehydrated -c -d cloverspb.ru -d www.cloverspb.ru
server {
    listen 443 ssl;
    server_name cloverspb.ru www.cloverspb.ru;

    ssl_certificate /dehydrated/certs/cloverspb.ru/fullchain.pem;
    ssl_certificate_key /dehydrated/certs/cloverspb.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSLCLOVERSPB:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/cloverspb-redirect.access.log;
    error_log /var/log/nginx/cloverspb-redirect.error.log warn;

    location / {
        if ($cloverspb_gone) {
            return 410;
        }
        if ($cloverspb_redirect) {
            return 301 $cloverspb_redirect$is_args$args;
        }
        return 404;
    }
}
