# Включить в http { } блок nginx.conf (или include conf.d/gzip.conf).
# Без gzip_proxied + gzip_types JS/CSS с vite preview уходят НЕСЖАТЫМИ (~700 KB вместо ~200 KB).

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff2;
