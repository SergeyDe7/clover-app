# Redirect legacy clover-order.ru → canonical clover-spb.ru
# Install (Andrey / root):
#   sudo cp /opt/clover/clover-app/ops/nginx/clover-order-redirect.conf /etc/nginx/sites-available/clover-order.ru
#   sudo ln -sfn /etc/nginx/sites-available/clover-order.ru /etc/nginx/sites-enabled/clover-order.ru
#   sudo dehydrated -c -d clover-order.ru   # if cert missing
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires valid cert for clover-order.ru (dehydrated) OR visitors get SSL warning
# before redirect. Prefer DNS: point clover-order.ru A → same IP + this vhost.

server {
    listen 443 ssl;
    server_name clover-order.ru www.clover-order.ru;

    ssl_certificate /dehydrated/certs/clover-order.ru/fullchain.pem;
    ssl_certificate_key /dehydrated/certs/clover-order.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ACME already on :80 via dehydrated catch-all
    return 301 https://clover-spb.ru$request_uri;
}
