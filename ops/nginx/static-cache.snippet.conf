# Фрагмент кэширования статики для clover-spb.ru / clover-order.ru
# Вставить ВЫШЕ `location /` в server { listen 443 ... }.
#
# Применить:
#   sudo cp ... /etc/nginx/sites-available/...  (или вставить вручную)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Важно: index.html / sw.js остаются без долгого кэша (через location /).

# Hashed Vite assets — год, immutable (имя файла меняется при билде)
location /assets/ {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Expires;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Фото/загрузки товаров
location /uploads/ {
    proxy_pass http://192.168.155.15:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
}

# Иконки / шрифты / favicon
location /fonts/ {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Expires;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~* ^/(favicon\.png|favicon-32\.png|apple-touch-icon\.png|icon-.*\.png|icons\.svg)$ {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# HTML shell / service worker — без долгого кэша
location = /index.html {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /sw.js {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /manifest.webmanifest {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

location = /robots.txt {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
}

location = /sitemap.xml {
    proxy_pass http://192.168.155.15:5273;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
}
