# Статика с диска (gzip nginx работает; proxy vite — часто нет).
# DIST_ROOT — каталог dist после npm run build.

location /assets/ {
    alias DIST_ROOT/assets/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location /fonts/ {
    alias DIST_ROOT/fonts/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ~* ^/(favicon\.png|favicon-32\.png|apple-touch-icon\.png|icon-.*\.png|icons\.svg|clover-logo\.png)$ {
    root DIST_ROOT;
    try_files $uri @clover_ui;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}
