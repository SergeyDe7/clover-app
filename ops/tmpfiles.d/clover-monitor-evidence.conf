# Producers use the existing clover group. ACLs apply only to sanitized evidence;
# clover-monitor receives no membership/ACL for application data or backups.
d /var/lib/clover-monitor-evidence 0770 root clover -
a+ /var/lib/clover-monitor-evidence - - - - u:clover-monitor:r-x,d:u:clover-monitor:r--
