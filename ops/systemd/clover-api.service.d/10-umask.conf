# Drop-in for clover-api. Do not install without a separate production approval.
# Destination: /etc/systemd/system/clover-api.service.d/10-umask.conf
# Makes new files created by clover-api (SQLite, WAL/SHM, preview) mode 600 / dirs 700.
# nginx proxies /uploads to the API, so existing public uploads are not served from disk by nginx.
[Service]
UMask=0077
