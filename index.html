<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Тот же hex, что splash/thank-you — иначе на iOS видна «линия» под status bar -->
    <meta name="theme-color" content="#d2e8cb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>Clover</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: #d2e8cb;
        background-color: #d2e8cb;
      }
      #clover-boot-splash {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        min-height: 100lvh;
        min-height: -webkit-fill-available;
        z-index: 2147483646;
        margin: 0;
        padding: 0;
        place-items: center;
        box-sizing: border-box;
        /* Только сплошной цвет — градиент даёт шов под status bar на iPhone */
        background: #d2e8cb;
        background-color: #d2e8cb;
        transition: opacity 0.38s ease, visibility 0.38s ease;
      }
      #clover-boot-splash img {
        display: block;
        width: min(220px, 58vw);
        height: auto;
        margin-top: env(safe-area-inset-top, 0px);
        animation: clover-boot-logo-in 0.55s ease-out both;
      }
      #clover-boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes clover-boot-logo-in {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (max-width: 900px), (display-mode: standalone), (display-mode: fullscreen) {
        #clover-boot-splash { display: grid; }
      }
      @media (prefers-reduced-motion: reduce) {
        #clover-boot-splash img { animation: none; }
        #clover-boot-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="clover-boot-splash" aria-hidden="true">
      <img src="/clover-logo.png" alt="" width="220" height="148" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
