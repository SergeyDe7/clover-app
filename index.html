      {

        "@type": "Organization",

    <meta name="clover-ui-build" content="%CLOVER_UI_BUILD%" />
    <script>
      (function () {
        var meta = document.querySelector('meta[name="clover-ui-build"]');
        var BUILD = meta && meta.getAttribute("content");
        if (!BUILD || BUILD.indexOf("%CLOVER_UI_BUILD%") >= 0) BUILD = "ui-dev";
        try {
          var prev = localStorage.getItem("clover-ui-build");
          if (prev === BUILD) return;
          if (sessionStorage.getItem("clover-ui-reloading") === BUILD) {
            localStorage.setItem("clover-ui-build", BUILD);
            sessionStorage.removeItem("clover-ui-reloading");
            return;
          }
          if (!prev) {
            localStorage.setItem("clover-ui-build", BUILD);
            return;
          }
          var finished = false;
          function finish() {
            if (finished) return;
            finished = true;
            sessionStorage.setItem("clover-ui-reloading", BUILD);
            location.reload();
          }
          var tasks = [];
          if (navigator.serviceWorker) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            );
          }
          if (window.caches && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
            );
          }
          if (tasks.length) {
            Promise.all(tasks).then(finish, finish);
            setTimeout(finish, 800);
          } else {
            finish();
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: #f4f8f2;
        background-color: #f4f8f2;
        font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
        color: #293329;
      }
      #clover-boot-splash {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        min-height: 100lvh;
        min-height: -webkit-fill-available;
        z-index: 2147483646;
        margin: 0;
        padding: 0;
        place-items: center;
        box-sizing: border-box;
        /* Только сплошной цвет — градиент даёт шов под status bar на iPhone */
        background: #f4f8f2;
        background-color: #f4f8f2;
        transition: opacity 0.38s ease, visibility 0.38s ease;
      }
      #clover-boot-splash img {
        display: block;
        width: min(220px, 58vw);
        height: auto;
        margin-top: env(safe-area-inset-top, 0px);
        animation: clover-boot-logo-in 0.55s ease-out both;
      }
      #clover-boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes clover-boot-logo-in {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (max-width: 900px), (display-mode: standalone), (display-mode: fullscreen) {
        #clover-boot-splash { display: grid; }
      }
      @media (prefers-reduced-motion: reduce) {
        #clover-boot-splash img { animation: none; }
        #clover-boot-splash { transition: none; }
      }
      /* Critical login shell — fluid + safe-area (без max()) */
      html.login-lock, html.login-lock body, html.login-lock #root {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f4f8f2;
        background-color: #f4f8f2;
      }
      .page,
      .login-page {
        position: fixed;
        inset: 0;
        min-height: 0;
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        overscroll-behavior: none;
        padding: 24px 16px 24px;
        padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
        padding-right: calc(env(safe-area-inset-right, 0px) + 16px);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
        padding-left: calc(env(safe-area-inset-left, 0px) + 16px);
        background-color: #f4f8f2;
        background-image: radial-gradient(ellipse 90% 55% at 50% 18%, rgba(91, 157, 87, 0.1), transparent 70%);
      }
      @media (min-width: 821px) and (min-height: 780px) {
        .page,
        .login-page {
          justify-content: center;
          padding-top: calc(env(safe-area-inset-top, 0px) + 32px);
        }
      }
      .login-card {
        width: min(100%, 460px);
        max-width: 460px;
        margin: 0 auto;
        padding: clamp(20px, 4vw, 36px) clamp(14px, 4vw, 28px);
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(86, 156, 80, 0.15);
        border-radius: 16px;
        box-shadow: 0 14px 36px rgba(48, 82, 45, 0.1);
        text-align: center;
        box-sizing: border-box;
      }
      .login-card .logo {
        display: block;
        width: clamp(120px, 42vw, 220px);
        max-width: 78%;
        height: auto;
        margin: 0 auto clamp(8px, 2vh, 14px);
      }
      .login-card h1 {
        margin: 0 0 10px;
        font-size: clamp(22px, 5.5vw, 28px);
        color: #386f37;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        text-align: left;
      }
      .login-form label {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        color: #3f4c3f;
      }
      .login-form input {

        height: 48px;
        margin-bottom: 12px;
        padding: 0 16px;
        border: 1px solid #d5dfd2;
        border-radius: 14px;
        background: #fbfdfb;
        font-size: 16px;
        box-sizing: border-box;
      }
      .login-form button[type="submit"] {
        height: 48px;
        margin-top: 6px;
        border: 0;
        border-radius: 14px;
        background: #5b9d57;
        color: #fff;
        font-weight: 700;
      }
